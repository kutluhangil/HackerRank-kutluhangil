<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Pipeline Architecture">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes pulse-dot {
        0%, 100% { r: 4px; opacity: 0.4; }
        50% { r: 6.5px; opacity: 1; filter: drop-shadow(0 0 6px #00ffcc); }
      }
      @keyframes active-flow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .dot-pulse { animation: pulse-dot 2.5s infinite; }
      .flow-path { stroke-dasharray: 6 4; animation: active-flow 1.5s linear infinite; }
    </style>
    <linearGradient id="box-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111c2e" />
      <stop offset="100%" stop-color="#0a101d" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="260" rx="12" fill="#060a12" stroke="#16233b" stroke-width="1.2" />

  <!-- Flow Lines -->
  <!-- Box 1 to 2 -->
  <path d="M 210 130 L 260 130" stroke="#00ffcc" stroke-width="2" class="flow-path" />
  <!-- Box 2 to 3 -->
  <path d="M 450 130 L 500 130" stroke="#00ffcc" stroke-width="2" class="flow-path" />
  <!-- Box 3 to 4 -->
  <path d="M 700 130 L 750 130" stroke="#00ffcc" stroke-width="2" class="flow-path" />

  <!-- STAGE 1: INGESTION -->
  <g transform="translate(30, 45)">
    <rect width="180" height="170" rx="8" fill="url(#box-fill)" stroke="#1e3656" stroke-width="1.2" />
    <rect width="180" height="28" rx="8" fill="#14243b" />
    <circle cx="16" cy="14" r="4.5" fill="#38bdf8" class="dot-pulse" />
    <text x="28" y="18" fill="#38bdf8" font-size="11" font-weight="bold" class="mono">1. EVIDENCE INGEST</text>
    
    <text x="14" y="54" fill="#cbd5e1" font-size="12" class="mono" font-weight="bold">Structured (79 Files)</text>
    <text x="14" y="70" fill="#64748b" font-size="10.5" class="mono">• SQLite SQL dumps</text>
    <text x="14" y="85" fill="#64748b" font-size="10.5" class="mono">• JSON snapshots</text>
    <text x="14" y="100" fill="#64748b" font-size="10.5" class="mono">• 5 System log dialects</text>

    <text x="14" y="125" fill="#cbd5e1" font-size="12" class="mono" font-weight="bold">Media (15 Files)</text>
    <text x="14" y="141" fill="#64748b" font-size="10.5" class="mono">• 11 Screenshots (Vision)</text>
    <text x="14" y="156" fill="#64748b" font-size="10.5" class="mono">• 4 Multi-page PDFs</text>
  </g>

  <!-- STAGE 2: RESOLUTION & INTENT -->
  <g transform="translate(260, 45)">
    <rect width="190" height="170" rx="8" fill="url(#box-fill)" stroke="#1e3656" stroke-width="1.2" />
    <rect width="190" height="28" rx="8" fill="#14243b" />
    <circle cx="16" cy="14" r="4.5" fill="#a855f7" class="dot-pulse" />
    <text x="28" y="18" fill="#a855f7" font-size="11" font-weight="bold" class="mono">2. IDENTITY &amp; INTENT</text>

    <text x="14" y="54" fill="#cbd5e1" font-size="12" class="mono" font-weight="bold">Identity Resolution</text>
    <text x="14" y="70" fill="#64748b" font-size="10.5" class="mono">• user_identities.csv</text>
    <text x="14" y="85" fill="#64748b" font-size="10.5" class="mono">• user_audit_log history</text>
    <text x="14" y="100" fill="#64748b" font-size="10.5" class="mono">• SHA-256 salted hashes</text>

    <text x="14" y="125" fill="#cbd5e1" font-size="12" class="mono" font-weight="bold">Claude Opus 5.5 / 4.8</text>
    <text x="14" y="141" fill="#64748b" font-size="10.5" class="mono">• Multilingual NLP</text>
    <text x="14" y="156" fill="#64748b" font-size="10.5" class="mono">• DELETE vs NOT_DELETE</text>
  </g>

  <!-- STAGE 3: TEMPORAL PLANNER -->
  <g transform="translate(500, 45)">
    <rect width="200" height="170" rx="8" fill="url(#box-fill)" stroke="#1e3656" stroke-width="1.2" />
    <rect width="200" height="28" rx="8" fill="#14243b" />
    <circle cx="16" cy="14" r="4.5" fill="#00ffcc" class="dot-pulse" />
    <text x="28" y="18" fill="#00ffcc" font-size="11" font-weight="bold" class="mono">3. DETERMINISTIC AUDIT</text>

    <text x="14" y="54" fill="#cbd5e1" font-size="12" class="mono" font-weight="bold">State at audit_at</text>
    <text x="14" y="70" fill="#64748b" font-size="10.5" class="mono">• Explicit observations</text>
    <text x="14" y="85" fill="#64748b" font-size="10.5" class="mono">• Strict batch attribution</text>
    <text x="14" y="100" fill="#64748b" font-size="10.5" class="mono">• Tombstone integrity</text>

    <text x="14" y="125" fill="#cbd5e1" font-size="12" class="mono" font-weight="bold">Policy Rules Engine</text>
    <text x="14" y="141" fill="#64748b" font-size="10.5" class="mono">• deletion_rules.csv</text>
    <text x="14" y="156" fill="#64748b" font-size="10.5" class="mono">• Phase ordering logic</text>
  </g>

  <!-- STAGE 4: OUTPUT CONTRACT -->
  <g transform="translate(750, 45)">
    <rect width="210" height="170" rx="8" fill="url(#box-fill)" stroke="#1e3656" stroke-width="1.2" />
    <rect width="210" height="28" rx="8" fill="#14243b" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" class="dot-pulse" />
    <text x="28" y="18" fill="#10b981" font-size="11" font-weight="bold" class="mono">4. VERIFIED DELIVERY</text>

    <text x="14" y="54" fill="#cbd5e1" font-size="12" class="mono" font-weight="bold">output.csv (518 Rows)</text>
    <text x="14" y="70" fill="#64748b" font-size="10.5" class="mono">• COMPLETE / INCOMPLETE</text>
    <text x="14" y="85" fill="#64748b" font-size="10.5" class="mono">• NOT_APPLICABLE</text>
    <text x="14" y="100" fill="#64748b" font-size="10.5" class="mono">• Canonical JSON steps</text>

    <text x="14" y="125" fill="#cbd5e1" font-size="12" class="mono" font-weight="bold">Zero Contract Violations</text>
    <text x="14" y="141" fill="#64748b" font-size="10.5" class="mono">• Atomic swap &amp; backup</text>
    <text x="14" y="156" fill="#10b981" font-size="10.5" class="mono" font-weight="bold">✓ 100% Validated</text>
  </g>
</svg>
