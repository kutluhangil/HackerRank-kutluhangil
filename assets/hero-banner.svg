<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Ghost Data Still Exists — AI Deletion Audit Agent">
  <title>Ghost Data Still Exists — HackerRank Orchestrate 2026</title>
  <defs>
    <style>
      @keyframes radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 12px #00ffcc); }
        50% { opacity: 0.85; filter: drop-shadow(0 0 28px #00ffcc); }
      }
      @keyframes crt-flicker {
        0%, 97%, 100% { opacity: 1; }
        98% { opacity: 0.75; }
        99% { opacity: 0.9; }
      }
      @keyframes scanline-roll {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      @keyframes data-flow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes rank-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px #ffb000); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 20px #ffb000); }
      }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .radar { transform-origin: 1040px 180px; animation: radar-sweep 8s linear infinite; }
      .glow-text { animation: pulse-glow 4s ease-in-out infinite; }
      .terminal-box { animation: crt-flicker 9s infinite; }
      .flow-line { stroke-dasharray: 8 6; animation: data-flow 2s linear infinite; }
      .badge-rank { animation: rank-pulse 3s ease-in-out infinite; transform-origin: 310px 345px; }
    </style>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0c121e" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#ffb000" />
    </linearGradient>

    <linearGradient id="radar-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#162238" stroke-width="0.8" opacity="0.6" />
    </pattern>

    <!-- Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" stroke="#1a2b48" stroke-width="1.5" />
  <rect width="1200" height="420" rx="16" fill="url(#cyber-grid)" />

  <!-- Ghost Watermark Icon (Subtle Background) -->
  <g opacity="0.04" transform="translate(850, 40) scale(4.5)">
    <path fill="#00ffcc" d="M12 2C6.47 2 2 6.47 2 12v9c0 .55.45 1 1 1s.75-.25 1.1-.6L6 19.5l2 2 2-2 2 2 2-2 1.9 1.9c.35.35.6.6 1.1.6.55 0 1-.45 1-1v-9c0-5.53-4.47-10-10-10zm-3 8c-.83 0-1.5-.67-1.5-1.5S8.17 7 9 7s1.5.67 1.5 1.5S9.83 10 9 10zm6 0c-.83 0-1.5-.67-1.5-1.5S14.17 7 15 7s1.5.67 1.5 1.5S15.83 10 15 10z"/>
  </g>

  <!-- Decorative Border Accents -->
  <path d="M 16 48 L 16 16 L 48 16" fill="none" stroke="#00ffcc" stroke-width="2.5" />
  <path d="M 1184 48 L 1184 16 L 1152 16" fill="none" stroke="#00ffcc" stroke-width="2.5" />
  <path d="M 16 372 L 16 404 L 48 404" fill="none" stroke="#00ffcc" stroke-width="2.5" />
  <path d="M 1184 372 L 1184 404 L 1152 404" fill="none" stroke="#00ffcc" stroke-width="2.5" />

  <!-- Radar Scan Visualizer (Right Side) -->
  <g transform="translate(0, 0)">
    <!-- Radar Rings -->
    <circle cx="1040" cy="180" r="140" fill="none" stroke="#162e4a" stroke-width="1.5" />
    <circle cx="1040" cy="180" r="100" fill="none" stroke="#1a395c" stroke-width="1" />
    <circle cx="1040" cy="180" r="60" fill="none" stroke="#1f4b7a" stroke-width="1" />
    <circle cx="1040" cy="180" r="20" fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.6" />
    <line x1="900" y1="180" x2="1180" y2="180" stroke="#162e4a" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="1040" y1="40" x2="1040" y2="320" stroke="#162e4a" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Radar Rotating Beam -->
    <path class="radar" d="M 1040 180 L 1180 180 A 140 140 0 0 0 1040 40 Z" fill="url(#radar-beam)" />

    <!-- Blip targets (discovered ghost records) -->
    <circle cx="985" cy="120" r="4.5" fill="#ff4d6d" filter="url(#neon-glow)" />
    <text x="996" y="124" fill="#ff4d6d" font-size="10" class="mono" font-weight="bold">GHOST_USER</text>

    <circle cx="1110" cy="140" r="3.5" fill="#ffb000" filter="url(#neon-glow)" />
    <text x="1120" y="144" fill="#ffd166" font-size="9" class="mono">UNLINKED_LOG</text>

    <circle cx="1070" cy="245" r="4" fill="#00ffcc" filter="url(#neon-glow)" />
    <text x="1080" y="249" fill="#00ffcc" font-size="9" class="mono">REDACTED_OK</text>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(60, 50)" class="terminal-box">
    <!-- Top System Pill -->
    <g transform="translate(0, 0)">
      <rect width="360" height="28" rx="14" fill="#0f1f33" stroke="#00ffcc" stroke-width="1" opacity="0.85" />
      <circle cx="14" cy="14" r="5" fill="#00ffcc" class="glow-text" />
      <text x="28" y="18" fill="#00ffcc" font-size="11" font-weight="bold" class="mono" letter-spacing="1.5">
        HACKERRANK ORCHESTRATE // OCT 2026
      </text>
    </g>

    <!-- Main Title: Ghost Data Still Exists -->
    <text x="0" y="76" fill="#ffffff" font-size="38" font-weight="900" class="sans" letter-spacing="-0.5">
      GHOST DATA <tspan fill="url(#accent-cyan)">STILL EXISTS</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#94a3b8" font-size="16" class="sans" font-weight="500">
      Autonomous AI Deletion Audit Agent &amp; Deterministic Compliance Pipeline
    </text>

    <!-- Terminal Prompt Line -->
    <g transform="translate(0, 136)">
      <rect width="680" height="68" rx="8" fill="#070d17" stroke="#1d2e47" stroke-width="1" />
      <text x="16" y="26" fill="#64748b" font-size="12" class="mono">&gt; AUDIT_TARGET: Northstar Shop Inc. ($2.4M Deletion Failure Investigation)</text>
      <text x="16" y="48" fill="#38bdf8" font-size="12" class="mono">&gt; ENGINE: Deterministic Core (79 Datasets) + Multimodal Claude Edge (15 Artifacts)</text>
    </g>

    <!-- Metric Status Pills -->
    <g transform="translate(0, 225)">
      <!-- Card 1: Leaderboard Rank -->
      <g class="badge-rank">
        <rect width="180" height="66" rx="10" fill="#131c2b" stroke="#ffb000" stroke-width="1.8" />
        <text x="16" y="24" fill="#ffd166" font-size="11" class="mono" font-weight="bold" letter-spacing="1">GLOBAL RANK</text>
        <text x="16" y="52" fill="#ffffff" font-size="26" font-weight="900" class="sans">#529 <tspan font-size="16" fill="#ffb000">/ Top Tier</tspan></text>
      </g>

      <!-- Card 2: Total Score -->
      <g transform="translate(196, 0)">
        <rect width="170" height="66" rx="10" fill="#131c2b" stroke="#00ffcc" stroke-width="1.5" />
        <text x="16" y="24" fill="#00ffcc" font-size="11" class="mono" font-weight="bold" letter-spacing="1">TOTAL SCORE</text>
        <text x="16" y="52" fill="#ffffff" font-size="26" font-weight="900" class="sans">67.2 <tspan font-size="15" fill="#64748b">/ 100</tspan></text>
      </g>

      <!-- Card 3: Output CSV Accuracy -->
      <g transform="translate(382, 0)">
        <rect width="190" height="66" rx="10" fill="#131c2b" stroke="#38bdf8" stroke-width="1.5" />
        <text x="16" y="24" fill="#38bdf8" font-size="11" class="mono" font-weight="bold" letter-spacing="1">CSV SCORE</text>
        <text x="16" y="52" fill="#ffffff" font-size="26" font-weight="900" class="sans">26.4 <tspan font-size="15" fill="#64748b">/ 30.0</tspan></text>
      </g>

      <!-- Card 4: Contract Violations -->
      <g transform="translate(588, 0)">
        <rect width="165" height="66" rx="10" fill="#131c2b" stroke="#10b981" stroke-width="1.5" />
        <text x="16" y="24" fill="#10b981" font-size="11" class="mono" font-weight="bold" letter-spacing="1">CONTRACT CHECK</text>
        <text x="16" y="52" fill="#ffffff" font-size="24" font-weight="900" class="sans">0 Violations</text>
      </g>
    </g>

    <!-- Bottom Status Line -->
    <g transform="translate(0, 312)">
      <circle cx="6" cy="6" r="4" fill="#10b981" />
      <text x="18" y="10" fill="#64748b" font-size="11" class="mono">
        518 CASES AUDITED · 3,173 ORDERED STEPS · 100% STATUS ACCURACY · TOTAL API COST: ~$0.60
      </text>
    </g>
  </g>
</svg>
